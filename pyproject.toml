[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stockmodel"
version = "0.1.0"
description = "Quantitative Swing Behavior Model (2-4 Week Horizon) with Cross-Sectional GBDT and ElasticNet Baseline"
authors = [
    { name = "Shawn Li", email = "shawn_li@live.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "polars>=0.20.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
stockmodel = "stockmodel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stockmodel*"]
